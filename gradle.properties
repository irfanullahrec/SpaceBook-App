# This PC has little free RAM (8 GB total, often under 1 GB free): keep every JVM small and in one process.
# -Djdk.net.unixdomain.tmpdir: JDK 17.0.18 on this PC cannot open a Selector (Gradle "Unable to establish loopback connection")
# unless its Unix-domain-socket folder is a short path without spaces. The launcher JVM needs the same flag:
#   set GRADLE_OPTS=-Djdk.net.unixdomain.tmpdir=C:/tmp   (see docs/BUILDING.md)
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=96m -Xss512k -Dfile.encoding=UTF-8 -Djdk.net.unixdomain.tmpdir=C:/tmp
org.gradle.daemon=true
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx1024m -Djdk.net.unixdomain.tmpdir=C:/tmp
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
