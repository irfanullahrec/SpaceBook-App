<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a2a6b">
  <title>Offline - SpaceBook</title>
  <style>
    :root { --bg: #eff7ff; --fg: #0a1f5c; --muted: #34476f; --brand: #0b5fd6; --card: #ffffff; --line: #d9e6f7; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--fg); font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
    main { width: min(100%, 44rem); padding: 32px 24px 28px; background: var(--card); border: 1px solid var(--line); border-radius: 20px; text-align: center; box-shadow: 0 4px 18px rgba(16, 52, 120, .08); }
    svg { width: 150px; height: 120px; }
    h1 { font-size: clamp(2rem, 6vw, 2.8rem); letter-spacing: -.02em; margin: 8px 0 6px; font-weight: 800; }
    .lead { font-size: 1.25rem; font-weight: 600; margin: 0 0 8px; }
    p { color: var(--muted); margin: 8px 0; }
    .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }
    a.btn, button.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 12px; font: inherit; font-weight: 700; font-size: 1.1rem; text-decoration: none; cursor: pointer; }
    a.btn { background: linear-gradient(180deg, #1f7bf4, #0b5fd6); color: #fff; border: 0; }
    button.btn { background: #fff; color: #0b4fc2; border: 1.5px solid #9ac2f6; }
  </style>
</head>
<body>
  <main>
    <svg viewBox="0 0 150 120" role="img" aria-label="No connection">
      <path d="M38 88a24 24 0 0 1-2-47.9A34 34 0 0 1 100 34a28 28 0 0 1 4 54z" fill="#dbeaff" stroke="#bcd6fb" stroke-width="2"/>
      <circle cx="100" cy="82" r="24" fill="#e0344a"/>
      <circle cx="100" cy="82" r="15" fill="none" stroke="#fff" stroke-width="5"/>
      <path d="M89 93l22-22" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    </svg>
    <h1>You are offline</h1>
    <p class="lead">Your downloaded books are still available.</p>
    <p>This page could not be loaded and is not saved on this device yet. Check your internet connection to use the full SpaceBook experience, including new content, tests and progress sync.</p>
    <div class="row">
      <a class="btn" href="./">Open Downloaded Books</a>
      <button class="btn" type="button" onclick="location.reload()">Try Again</button>
    </div>
  </main>
</body>
</html>
